# ============================================================
# NAVIGATION CONFIG
# ============================================================
navigation:
  dilation_radius: 10  # Obstacle inflation radius (grid cells); larger keeps paths farther from walls. Default 10.
  top_k_anchors: 3     # Number of anchor candidates returned per retrieval
  lifelong_navigation: false # Lifelong navigation (incremental representative-frame updates)
  max_relocalization_attempts: 3 # Max relocalization attempts for object re-finding (loop count)

# ============================================================
# OUTPUT CONFIG
# ============================================================
# output directory
output_path: ./output/map_results

# Visualization settings
visualize_mode: "manual" # "auto" (3s timeout) or "manual" (click to continue)
# visualize_mode: "manual"

# Real-time best-frame selection
realtime_best_frames:
  enabled: true  # Enable real-time best-frame selection
  save_interval: 10  # Save a realtime best frame every N processed frames
  max_frames_per_object: 5  # Max best frames kept per object



# ============================================================
# OASIS ABLATION (Replica Instance Coverage)
# ============================================================
# One runner_dataset run produces 9 configs (3 clustering x 3 frame selection)
run_oasis_ablation: true
# Replica GT root (only when run_oasis_ablation and using Replica)
replica_gt_path: /path/to/OASIS/openlex3d/data/replica
replica_gt_scene_id: office_4  # Options: room_1, room_2, office_0, office_1, office_2, office_3, office_4


# ============================================================
# LOGGING CONFIG
# ============================================================
# logging config
logging_config: ./config/support_config/logging_config.yaml